<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Lite - Company Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-weight: 500; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 16px !important; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .sidebar { background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); min-height: 100vh; }
        .sidebar .nav-link { font-weight: 600; border-radius: 10px; margin-bottom: 5px; }
        
        .page-header-box {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            color: #ffffff;
            padding: 1.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25);
        }
        .page-header-box h1 { font-weight: 800; letter-spacing: 0.5px; }
    </style>
</head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3 shadow">
                <div class="d-flex align-items-center mb-4 text-white px-2">
                    <i class="bi bi-building fs-3 me-2 text-indigo"></i>
                    <h4 class="m-0 fw-bold">HCM Lite</h4>
                </div>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item"><a href="admin.html" class="nav-link text-white-50"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
                    <li class="nav-item"><a href="employees.html" class="nav-link text-white-50"><i class="bi bi-people me-2"></i> Employees</a></li>
                    <li class="nav-item"><a href="leaves.html" class="nav-link text-white-50"><i class="bi bi-calendar-check me-2"></i> Leave Requests</a></li>
                    <li class="nav-item"><a href="settings.html" class="nav-link active bg-indigo text-white fw-bold" style="background-color: #4338ca;"><i class="bi bi-gear me-2"></i> Settings</a></li>
                    <li class="nav-item mt-5"><a href="index.html" class="nav-link text-danger fw-bold"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="page-header-box mb-4">
                    <h1 class="h2 m-0 text-white">Company Settings</h1>
                    <p class="m-0 text-white-50 small mt-1">Configure global office timings, grace windows, and leave quotas.</p>
                </div>

                <div class="card shadow-sm p-4 col-lg-8 bg-white">
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Company Name</label>
                            <input type="text" class="form-control form-control-lg fw-semibold" value="TechCorp IT Park" required>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Office Start Time</label>
                                <input type="time" class="form-control form-control-lg fw-semibold" value="09:00" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Grace Minutes</label>
                                <input type="number" class="form-control form-control-lg fw-semibold" value="15" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Yearly Leave Quota (Days)</label>
                            <input type="number" class="form-control form-control-lg fw-semibold" value="20" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold d-block mb-2">Working Days</label>
                            <div class="form-check form-check-inline fs-5 me-3">
                                <input class="form-check-input" type="checkbox" checked id="mon"><label class="form-check-label fw-semibold" for="mon">Mon</label>
                            </div>
                            <div class="form-check form-check-inline fs-5 me-3">
                                <input class="form-check-input" type="checkbox" checked id="tue"><label class="form-check-label fw-semibold" for="tue">Tue</label>
                            </div>
                            <div class="form-check form-check-inline fs-5 me-3">
                                <input class="form-check-input" type="checkbox" checked id="wed"><label class="form-check-label fw-semibold" for="wed">Wed</label>
                            </div>
                            <div class="form-check form-check-inline fs-5 me-3">
                                <input class="form-check-input" type="checkbox" checked id="thu"><label class="form-check-label fw-semibold" for="thu">Thu</label>
                            </div>
                            <div class="form-check form-check-inline fs-5">
                                <input class="form-check-input" type="checkbox" checked id="fri"><label class="form-check-label fw-semibold" for="fri">Fri</label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg px-5 py-3 fw-bold rounded-pill">Save Settings</button>
                    </form>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
