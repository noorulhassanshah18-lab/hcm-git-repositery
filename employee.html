<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Lite - Employee Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-weight: 500; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 16px !important; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .page-header-box {
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            color: #ffffff;
            padding: 1.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.25);
        }
        .page-header-box h3 { font-weight: 800; }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 1000px;">
        <!-- Header -->
        <div class="page-header-box d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="m-0 text-white">Employee Dashboard</h3>
                <span class="text-white-50 small fw-semibold mt-1 d-block">Welcome back, Alex Johnson</span>
            </div>
            <div>
                <a href="payslip.html" class="btn btn-light text-primary fw-bold px-4 py-2 rounded-pill me-2 shadow-sm"><i class="bi bi-receipt"></i> My Payslip</a>
                <a href="index.html" class="btn btn-outline-light fw-bold px-4 py-2 rounded-pill"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>

        <!-- Attendance & Leave Status -->
        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="card shadow-sm p-4 text-center h-100 bg-white">
                    <h5 class="text-secondary fw-bold mb-3">Daily Check-In / Check-Out</h5>
                    <div class="d-flex justify-content-center gap-3 mt-3">
                        <button class="btn btn-success px-4 py-3 fw-bold rounded-pill shadow-sm"><i class="bi bi-box-arrow-in-right me-1"></i> Check In</button>
                        <button class="btn btn-danger px-4 py-3 fw-bold rounded-pill shadow-sm"><i class="bi bi-box-arrow-left me-1"></i> Check Out</button>
                    </div>
                    <p class="text-secondary fw-semibold mt-4 mb-0">Status today: <span class="badge bg-success px-3 py-2 rounded-pill">Present (08:55 AM)</span></p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm p-4 h-100 bg-white">
                    <h5 class="text-secondary fw-bold mb-3">Leave Balance Summary</h5>
                    <div class="d-flex justify-content-around text-center mt-4">
                        <div>
                            <span class="text-muted small fw-bold d-block text-uppercase">Quota</span>
                            <h2 class="fw-extrabold text-dark mt-1">20</h2>
                        </div>
                        <div>
                            <span class="text-muted small fw-bold d-block text-uppercase">Taken</span>
                            <h2 class="fw-extrabold text-warning mt-1">4</h2>
                        </div>
                        <div>
                            <span class="text-muted small fw-bold d-block text-uppercase">Remaining</span>
                            <h2 class="fw-extrabold text-success mt-1">16</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Leave Application Form -->
        <div class="card shadow-sm p-4 mb-4 bg-white">
            <h4 class="card-title text-primary fw-bold mb-4"><i class="bi bi-file-earmark-plus me-1"></i> Apply for Leave</h4>
            <form>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Leave Type</label>
                        <select class="form-select form-select-lg fw-semibold">
                            <option>Casual Leave</option>
                            <option>Sick Leave</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">From Date</label>
                        <input type="date" class="form-control form-control-lg fw-semibold" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">To Date</label>
                        <input type="date" class="form-control form-control-lg fw-semibold" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Reason</label>
                        <textarea class="form-control fw-semibold" rows="3" placeholder="Provide reason..." required></textarea>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg px-5 py-3 fw-bold rounded-pill">Submit Application</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Smart Helper -->
        <div class="card shadow-sm p-4 bg-white">
            <h4 class="card-title text-primary fw-bold mb-3"><i class="bi bi-robot me-2"></i> Employee Smart Helper</h4>
            <div class="chat-container p-3 mb-3 fw-semibold">
                <div class="d-flex mb-2">
                    <div class="chat-bubble-ai p-3 rounded-4 bg-light text-dark shadow-sm">
                        Hi Alex! Ask me about your remaining leave balance or attendance.
                    </div>
                </div>
            </div>
            <div class="input-group">
                <input type="text" class="form-control form-control-lg fw-semibold" placeholder="Ask: How many leaves do I have left?...">
                <button class="btn btn-primary px-4 fw-bold" type="button">Ask AI</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
