<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Lite - Manage Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-weight: 500; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 16px !important; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .sidebar { background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); min-height: 100vh; }
        .sidebar .nav-link { font-weight: 600; border-radius: 10px; margin-bottom: 5px; }
        
        .page-header-box {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: #ffffff;
            padding: 1.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.25);
        }
        .page-header-box h1 { font-weight: 800; letter-spacing: 0.5px; }
        table th { font-weight: 700 !important; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
        table td { font-weight: 600; }
    </style>
</head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3 shadow">
                <div class="d-flex align-items-center mb-4 text-white px-2">
                    <i class="bi bi-building fs-3 me-2 text-success"></i>
                    <h4 class="m-0 fw-bold">HCM Lite</h4>
                </div>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item"><a href="admin.html" class="nav-link text-white-50"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
                    <li class="nav-item"><a href="employees.html" class="nav-link active bg-success text-white"><i class="bi bi-people me-2"></i> Employees</a></li>
                    <li class="nav-item"><a href="leaves.html" class="nav-link text-white-50"><i class="bi bi-calendar-check me-2"></i> Leave Requests</a></li>
                    <li class="nav-item"><a href="settings.html" class="nav-link text-white-50"><i class="bi bi-gear me-2"></i> Settings</a></li>
                    <li class="nav-item mt-5"><a href="index.html" class="nav-link text-danger fw-bold"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="page-header-box d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h2 m-0 text-white">Manage Employees</h1>
                        <p class="m-0 text-white-50 small mt-1">Directory of all 40 active organization personnel.</p>
                    </div>
                    <button class="btn btn-light px-4 py-2 fw-bold text-success rounded-pill shadow-sm" data-bs-toggle="modal" data-bs-target="#addEmployeeModal"><i class="bi bi-plus-lg me-1"></i> Add Employee</button>
                </div>

                <!-- Filters & Search -->
                <div class="card shadow-sm p-4 mb-4 bg-white">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input type="text" id="employeeSearch" class="form-control form-control-lg fw-semibold" placeholder="🔍 Search employee by name, email or department...">
                        </div>
                        <div class="col-md-4">
                            <select id="departmentFilter" class="form-select form-select-lg fw-semibold">
                                <option value="">All Departments</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Marketing">Marketing</option>
                                <option value="HR">HR</option>
                                <option value="Finance">Finance</option>
                                <option value="Operations">Operations</option>
                                <option value="Sales">Sales</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button id="resetBtn" class="btn btn-outline-secondary btn-lg w-100 fw-bold">Reset</button>
                        </div>
                    </div>
                </div>

                <!-- Employee Directory Table (All 40 Employees) -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
                            <table class="table table-hover align-middle m-0" id="employeeTable">
                                <thead class="table-dark sticky-top">
                                    <tr>
                                        <th class="ps-4">Name</th>
                                        <th>Email</th>
                                        <th>Department</th>
                                        <th>Monthly Salary</th>
                                        <th class="pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Populated dynamically via script -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Add Employee Modal -->
                <div class="modal fade" id="addEmployeeModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content rounded-4 border-0 shadow">
                            <div class="modal-header bg-success text-white">
                                <h5 class="modal-title fw-bold">Add New Employee</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body p-4">
                                <form>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Full Name</label>
                                        <input type="text" class="form-control fw-semibold" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Email Address</label>
                                        <input type="email" class="form-control fw-semibold" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Password</label>
                                        <input type="password" class="form-control fw-semibold" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Department</label>
                                        <select class="form-select fw-semibold" required>
                                            <option>Engineering</option>
                                            <option>Marketing</option>
                                            <option>HR</option>
                                            <option>Finance</option>
                                            <option>Operations</option>
                                            <option>Sales</option>
                                        </select>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Monthly Salary ($)</label>
                                        <input type="number" class="form-control fw-semibold" min="1" required>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-pill">Save Employee</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Script to Generate All 40 Employees Dynamically -->
    <script>
        const departments = ['Engineering', 'Marketing', 'HR', 'Finance', 'Operations', 'Sales'];
        const firstNames = ['Alex', 'Sarah', 'Michael', 'Emily', 'David', 'Jessica', 'James', 'Amanda', 'Robert', 'Lisa', 'William', 'Ashley', 'John', 'Megan', 'Brian', 'Rachel', 'Kevin', 'Laura', 'Thomas', 'Nicole'];
        const lastNames = ['Johnson', 'Smith', 'Brown', 'Davis', 'Wilson', 'Miller', 'Taylor', 'Anderson', 'Thomas', 'Jackson', 'White', 'Harris', 'Martin', 'Garcia', 'Martinez', 'Robinson', 'Clark', 'Rodriguez', 'Lewis', 'Lee'];

        const tableBody = document.querySelector('#employeeTable tbody');
        let employeesData = [];

        // Generate 40 employees
        for (let i = 1; i <= 40; i++) {
            const fName = firstNames[(i - 1) % firstNames.length];
            const lName = lastNames[Math.floor((i - 1) / firstNames.length) % lastNames.length];
            const name = `${fName} ${lName} (${i})`;
            const email = `${fName.toLowerCase()}.${lName.toLowerCase()}${i}@company.com`;
            const dept = departments[(i * 3) % departments.length];
            const salary = `$${(4000 + (i * 125)).toLocaleString()}`;

            employeesData.push({ name, email, dept, salary });
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted fw-bold">No employees found matching your criteria.</td></tr>`;
                return;
            }
            data.forEach(emp => {
                const row = `
                    <tr>
                        <td class="ps-4 text-dark">${emp.name}</td>
                        <td class="text-secondary">${emp.email}</td>
                        <td><span class="badge bg-light text-dark border px-3 py-2 rounded-pill">${emp.dept}</span></td>
                        <td class="text-success fw-bold">${emp.salary}</td>
                        <td class="pe-4">
                            <a href="payslip.html" class="btn btn-sm btn-outline-info fw-bold me-1"><i class="bi bi-file-earmark-text"></i> Payslip</a>
                            <button class="btn btn-sm btn-outline-primary fw-bold me-1"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger fw-bold"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        renderTable(employeesData);

        // Filter & Search Logic
        function filterEmployees() {
            const searchTerm = document.getElementById('employeeSearch').value.toLowerCase();
            const deptTerm = document.getElementById('departmentFilter').value;

            const filtered = employeesData.filter(emp => {
                const matchesSearch = emp.name.toLowerCase().includes(searchTerm) || emp.email.toLowerCase().includes(searchTerm);
                const matchesDept = deptTerm === "" || emp.dept === deptTerm;
                return matchesSearch && matchesDept;
            });

            renderTable(filtered);
        }

        document.getElementById('employeeSearch').addEventListener('input', filterEmployees);
        document.getElementById('departmentFilter').addEventListener('change', filterEmployees);
        
        document.getElementById('resetBtn').addEventListener('click', function() {
            document.getElementById('employeeSearch').value = '';
            document.getElementById('departmentFilter').value = '';
            renderTable(employeesData);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
