<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Lite - Monthly Payslip</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-weight: 500; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 20px !important; border: none; }
        .payslip-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 2rem;
            border-radius: 16px 16px 0 0;
            margin: -3rem -3rem 2rem -3rem;
        }
    </style>
</head>
<body class="bg-dark py-5">

    <div class="container" style="max-width: 750px;">
        <div class="card shadow-lg p-5 bg-white">
            <!-- Header Box -->
            <div class="payslip-header d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold m-0 text-white">TechCorp Solutions</h3>
                    <span class="text-white-50 small fw-semibold">Monthly Salary Statement</span>
                </div>
                <div class="text-end">
                    <span class="badge bg-success px-3 py-2 rounded-pill fs-6 fw-bold">PAID</span>
                    <p class="text-white-50 small m-0 mt-1 fw-semibold">Month: October 2026</p>
                </div>
            </div>

            <!-- Employee Info -->
            <div class="row mb-4 fw-semibold bg-light p-3 rounded-4">
                <div class="col-6">
                    <p class="mb-1 text-dark"><strong>Employee:</strong> Alex Johnson</p>
                    <p class="mb-0 text-dark"><strong>Department:</strong> Engineering</p>
                </div>
                <div class="col-6 text-end">
                    <p class="mb-1 text-dark"><strong>Working Days:</strong> 22 Days</p>
                    <p class="mb-0 text-danger"><strong>Absent Days:</strong> 1 Day</p>
                </div>
            </div>

            <!-- Calculation Breakdown Table -->
            <table class="table table-bordered align-middle mb-4">
                <thead class="table-dark">
                    <tr>
                        <th class="py-3 ps-3">Description</th>
                        <th class="text-end py-3 pe-3">Amount ($)</th>
                    </tr>
                </thead>
                <tbody class="fw-semibold">
                    <tr>
                        <td class="ps-3">Base Monthly Salary</td>
                        <td class="text-end pe-3 text-dark">$5,500.00</td>
                    </tr>
                    <tr>
                        <td class="ps-3">Absence Deductions (1 Day)</td>
                        <td class="text-end pe-3 text-danger">-$250.00</td>
                    </tr>
                    <tr class="table-light fw-bold fs-5">
                        <td class="py-3 ps-3 text-success">Net Payable Salary</td>
                        <td class="text-end py-3 pe-3 text-success">$5,250.00</td>
                    </tr>
                </tbody>
            </table>

            <!-- Actions -->
            <div class="d-flex justify-content-between align-items-center mt-4">
                <a href="admin.html" class="btn btn-outline-secondary px-4 py-2 fw-bold rounded-pill"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
                <button onclick="window.print()" class="btn btn-primary px-5 py-3 fw-bold rounded-pill shadow-sm"><i class="bi bi-printer me-1"></i> Print / Save PDF</button>
            </div>
        </div>
    </div>

</body>
</html>
